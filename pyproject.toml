[project]
name = "spark-foresight"
version = "0.1.0"
description = "100% On-Device Meeting & Knowledge Intelligence for Linux (NVIDIA / PipeWire / Gemma 4 / Ollama)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.15.0",
    "aiosqlite>=0.22.1",
    "fastapi>=0.143.1",
    "faster-whisper>=1.2.1",
    "numpy>=2.5.4",
    "pydantic>=2.14.1",
    "pypdf>=6.20.1",
    "rich>=13.0.0",
    "silero-vad>=6.2.3",
    "soundfile>=0.14.0",
    "torch>=2.14.1",
    "transformers>=5.19.0",
    "uvicorn>=0.54.0",
    "watchdog>=6.0.0",
    "websockets>=17.2",
]

[project.scripts]
spark-foresight = "spark_foresight:main"
open-foresight = "spark_foresight:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
